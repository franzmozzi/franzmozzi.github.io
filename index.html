<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franz Mozzi — experiments and demos</title>
<meta name="description" content="Experiments and little toys by Franz Mozzi, a web professional with twenty-five years of experience.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #faf8f4; --fg: #231a15; --muted: #6b645c; --line: #e2ddd3; --accent: #9a3b1f;
    /* Figure width and title size; the title is pushed down so that its
       middle sits at the fingertip, 60.3% of the drawing's height (1395/1230 aspect). */
    --fig-w: 16rem; --h1-size: 2.2rem; --col: 36rem;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --fg: #ece8e1; --muted: #9a948a; --line: #2e2b27; --accent: #e08a62; }
    .figure img { filter: invert(1) brightness(.92); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 18px/1.6 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  main { max-width: 58rem; margin: 0 auto; padding: 4rem 1.5rem 3rem; }

  /* The figure floats right and the text wraps around the drawn outline. */
  .figure {
    float: right; width: var(--fig-w); margin: 0;
    shape-margin: .75rem;
    /* Left edge of the drawing, row by row, traced from manicula.svg. */
    shape-outside: polygon(100.0% 0.0%, 49.2% 0.0%, 49.2% 1.3%, 43.5% 1.3%, 43.5% 2.6%, 42.2% 2.6%, 42.2% 4.0%, 41.5% 4.0%, 41.5% 5.3%, 37.0% 5.3%, 37.0% 9.3%, 35.5% 9.3%, 35.5% 10.6%, 33.8% 10.6%, 33.8% 11.9%, 33.2% 11.9%, 33.2% 14.5%, 33.0% 14.5%, 33.0% 15.9%, 32.5% 15.9%, 32.5% 19.8%, 33.2% 19.8%, 33.2% 22.5%, 33.5% 22.5%, 33.5% 23.8%, 34.2% 23.8%, 34.2% 25.1%, 34.8% 25.1%, 34.8% 26.4%, 34.2% 26.4%, 34.2% 27.8%, 32.0% 27.8%, 32.0% 29.1%, 31.5% 29.1%, 31.5% 31.7%, 32.5% 31.7%, 32.5% 33.0%, 33.0% 33.0%, 33.0% 34.4%, 33.5% 34.4%, 33.5% 35.7%, 34.5% 35.7%, 34.5% 37.0%, 35.0% 37.0%, 35.0% 39.6%, 34.8% 39.6%, 34.8% 41.0%, 34.5% 41.0%, 34.5% 42.3%, 34.2% 42.3%, 34.2% 50.2%, 34.8% 50.2%, 34.8% 51.5%, 35.2% 51.5%, 35.2% 52.9%, 35.8% 52.9%, 35.8% 54.2%, 36.8% 54.2%, 36.8% 55.5%, 37.2% 55.5%, 37.2% 56.8%, 38.2% 56.8%, 38.2% 58.1%, 1.0% 58.1%, 1.0% 59.5%, 0.8% 59.5%, 0.8% 62.1%, 2.2% 62.1%, 2.2% 63.4%, 10.5% 63.4%, 10.5% 64.8%, 9.5% 64.8%, 9.5% 68.7%, 10.2% 68.7%, 10.2% 70.0%, 10.8% 70.0%, 10.8% 71.4%, 11.5% 71.4%, 11.5% 72.7%, 12.5% 72.7%, 12.5% 74.0%, 20.2% 74.0%, 20.2% 75.3%, 24.0% 75.3%, 24.0% 76.7%, 28.5% 76.7%, 28.5% 78.0%, 30.5% 78.0%, 30.5% 79.3%, 32.5% 79.3%, 32.5% 80.6%, 34.5% 80.6%, 34.5% 81.9%, 36.2% 81.9%, 36.2% 83.3%, 38.5% 83.3%, 38.5% 84.6%, 40.2% 84.6%, 40.2% 85.9%, 42.5% 85.9%, 42.5% 87.2%, 43.5% 87.2%, 43.5% 88.5%, 43.0% 88.5%, 43.0% 89.9%, 42.8% 89.9%, 42.8% 91.2%, 42.5% 91.2%, 42.5% 92.5%, 42.0% 92.5%, 42.0% 96.5%, 50.0% 96.5%, 50.0% 97.8%, 52.2% 97.8%, 52.2% 99.1%, 52.5% 99.1%, 52.5% 100.0%, 100.0% 100.0%);
  }
  .figure img { display: block; width: 100%; height: auto; }

  h1 {
    font-size: var(--h1-size); line-height: 1.6; font-weight: normal; letter-spacing: -.01em;
    margin: 0 0 .25rem;
    padding-top: calc(var(--fig-w) * 1395 / 1230 * .6032 - var(--h1-size) * 1.6 / 2);
  }
  .sub { color: var(--muted); margin: 0 0 3rem; max-width: 30rem; }
  h2 {
    clear: both; max-width: var(--col);
    font: 600 .75rem/1 system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .12em; color: var(--muted); margin: 0 0 1rem;
  }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-width: var(--col); }
  li { border-bottom: 1px solid var(--line); }
  li a { display: block; padding: 1.1rem 0; color: inherit; text-decoration: none; }
  li a:hover .name, li a:focus-visible .name { color: var(--accent); }
  .name { font-size: 1.2rem; transition: color .15s; }
  .name::after { content: " →"; color: var(--accent); }
  .desc { display: block; color: var(--muted); font-size: .95rem; }
  footer { margin-top: 3rem; font: .85rem system-ui, sans-serif; color: var(--muted); }
  footer a { color: inherit; }

  @media (max-width: 44rem) {
    :root { --fig-w: 8.5rem; --h1-size: 1.8rem; }
    main { padding-top: 2rem; }
    .figure { shape-margin: .5rem; }
    .sub { font-size: .95rem; }
  }
</style>
</head>
<body>
<main>
  <figure class="figure">
    <img src="manicula.svg" width="1230" height="1395" alt="Drawn portrait of Franz pointing at his name">
  </figure>

  <h1>Franz Mozzi</h1>
  <p class="sub">Home to the experiments and little toys of a web professional with twenty-five years of experience.</p>

  <h2>Demos</h2>
  <ul>
    <li>
      <a href="/manicula/">
        <span class="name">Dynamic maniculæ</span>
        <span class="desc">An editorial prototype: pointing hands in the page margins, with the text reflowing around their outlines in real time.</span>
      </a>
    </li>
    <!-- To add a demo, copy the <li> block above and change link, name and description. -->
  </ul>

  <footer>
    <a href="https://github.com/franzmozzi">github.com/franzmozzi</a>
  </footer>
</main>
</body>
</html>
