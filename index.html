<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franz Mozzi — demo e progetti</title>
<meta name="description" content="Demo e prototipi di Franz Mozzi.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #faf8f4; --fg: #231a15; --muted: #6b645c; --line: #e2ddd3; --accent: #9a3b1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --fg: #ece8e1; --muted: #9a948a; --line: #2e2b27; --accent: #e08a62; }
    .figure img { filter: invert(1) brightness(.92); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 18px/1.6 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }
  main {
    max-width: 58rem; margin: 0 auto; padding: 4rem 1.5rem 3rem;
    display: grid; grid-template-columns: minmax(0, 1fr) 16rem; gap: 3rem; align-items: start;
  }
  .figure { position: sticky; top: 2rem; margin: 0; }
  .figure img { display: block; width: 100%; height: auto; }
  h1 { font-size: 2.2rem; font-weight: normal; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 3rem; }
  h2 {
    font: 600 .75rem/1 system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .12em; color: var(--muted); margin: 0 0 1rem;
  }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a { display: block; padding: 1.1rem 0; color: inherit; text-decoration: none; }
  li a:hover .name, li a:focus-visible .name { color: var(--accent); }
  .name { font-size: 1.2rem; transition: color .15s; }
  .name::after { content: " →"; color: var(--accent); }
  .desc { display: block; color: var(--muted); font-size: .95rem; }
  footer { margin-top: 3rem; font: .85rem system-ui, sans-serif; color: var(--muted); }
  footer a { color: inherit; }

  @media (max-width: 44rem) {
    main { grid-template-columns: 1fr; gap: 1.5rem; padding-top: 2rem; }
    .figure { position: static; order: -1; width: 9.5rem; justify-self: end; }
  }
</style>
</head>
<body>
<main>
  <div class="content">
    <h1>Franz Mozzi</h1>
    <p class="sub">Demo e prototipi.</p>

    <h2>Demo</h2>
    <ul>
      <li>
        <a href="/manicula/">
          <span class="name">Dynamic maniculæ</span>
          <span class="desc">Prototipo editoriale: manicule a margine della pagina, con il testo che scorre in tempo reale attorno alle loro sagome.</span>
        </a>
      </li>
      <!-- Per aggiungere una demo, copia il blocco <li> qui sopra e cambia link, nome e descrizione. -->
    </ul>

    <footer>
      <a href="https://github.com/franzmozzi">github.com/franzmozzi</a>
    </footer>
  </div>

  <figure class="figure">
    <img src="manicula.svg" width="1230" height="1395" alt="Ritratto disegnato di Franz che indica l'elenco delle demo">
  </figure>
</main>
</body>
</html>
